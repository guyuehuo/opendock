name: docs

on:
  push:
    branches: [main, v1.1.2]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      # Build the HTML docs and treat any Sphinx warning as an error so broken
      # references / toctree entries are caught before they reach readthedocs.
      - name: Build Sphinx docs
        run: sphinx-build -b html -W --keep-going docs/source docs/_build
